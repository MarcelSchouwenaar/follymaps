# PagesCMS Configuration for Follymaps
# This file configures the content management system for the Follymaps geolocation website

media: public/img

content:
  - name: posts
    label: Posts
    type: collection
    path: content/blog
    view:
      fields: [ title, draft, date ]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: string }
      - { name: date, label: Date, type: date }
      - { name: draft, label: Draft, type: boolean }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: body, label: Body, type: rich-text }
  - name: follymaps-about
    label: Follymaps About
    type: file
    path: content/pages/about.md
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: string }
      - { name: permalink, label: Permalink, type: string }
      - { name: layout, label: Layout, type: string, default: layouts/base.njk }
      - { name: body, label: Body, type: rich-text }
      
  - name: metadata
    label: Metadata
    type: file
    path: _data/metadata.js
    format: code